services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_MODE: 'true'
      HOST: 0.0.0.0
      PORT: '3001'
      SERVE_FRONTEND: 'true'
      DATABASE_PATH: /data/breaktrail.sqlite
      CLIENT_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
      OLLAMA_TIMEOUT_MS: '90000'
      ALLOW_RULE_FALLBACK: 'false'
    volumes:
      - app_data:/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  ollama_data:
  caddy_data:
  caddy_config:
